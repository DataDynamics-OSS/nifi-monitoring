# NiFi 모니터링용 Alertmanager 설정입니다.
#
# 아래 수신처는 자리표시자입니다. Slack 웹훅 파일, SMTP 설정, 호출기 webhook을
# 환경에 맞게 채웁니다. 검증 명령은 다음과 같습니다.
#   amtool check-config alertmanager.yml

global:
  resolve_timeout: 5m
  # Slack: incoming-webhook URL은 이 YAML이 아니라 이 파일(권한 0600)에 넣습니다.
  slack_api_url_file: /etc/alertmanager/slack_webhook
  # 메일 발송 설정입니다. SMTP 비밀번호도 파일로 넣습니다.
  smtp_smarthost: smtp.example.com:587
  smtp_from: nifi-alerts@example.com
  smtp_auth_username: nifi-alerts@example.com
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: ops-slack
  group_by: [alertname, cluster, pg_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 모든 알림을 사용자 정의 HTTP 수신처 중계(nifi-alert-relay)에도 보냅니다. 어느 대상에
    # 무엇을 보낼지는 중계 설정(대상별 match)이 정합니다. continue로 아래 경로도 계속 탑니다.
    - receiver: custom-relay
      continue: true

    # exporter·수집 문제는 플랫폼팀에만 보냅니다. 이 알림이 발화하는 동안 NiFi 상태
    # 알림은 억제됩니다(inhibit_rules 참조).
    - matchers: [component="exporter"]
      receiver: platform-team
      group_by: [alertname, cluster]
      repeat_interval: 1h

    # Critical: 호출기 + Slack으로 보냅니다.
    - matchers: [severity="critical"]
      receiver: ops-pager
      continue: true
    - matchers: [severity="critical"]
      receiver: ops-slack
      repeat_interval: 1h

    # 그 밖의 알림(warning)은 기본 그룹으로 Slack에 보냅니다.
    - matchers: [severity="warning"]
      receiver: ops-slack

inhibit_rules:
  # exporter 다운 또는 collector 실패: NiFi 상태를 알 수 없으므로, 빠지거나 일부만
  # 있는 데이터로 호출하지 않도록 해당 클러스터의 NiFi 알림을 모두 억제합니다.
  - source_matchers: [alertname=~"NiFiExporterDown|NiFiCollectorFailing"]
    target_matchers: [component!="exporter"]
    equal: [cluster]
  # 노드 단절: 큐·Processor·Bulletin 알림은 그 결과이므로 억제합니다.
  - source_matchers: [alertname="NiFiNodeDisconnected"]
    target_matchers: [component=~"queue|processor|bulletin"]
    equal: [cluster]
  # 과반 상실 알림이 개별 노드 알림을 대신합니다.
  - source_matchers: [alertname="NiFiClusterQuorumLost"]
    target_matchers: [alertname=~"NiFiNodeDisconnected|NiFiNodeHeartbeatStale"]
    equal: [cluster]
  # Backpressure 발동(critical)이 같은 큐의 80%·증가 warning을 대신합니다.
  - source_matchers: [alertname="NiFiQueueBackpressureEngaged"]
    target_matchers: [alertname=~"NiFiQueueNearBackpressure|NiFiQueueGrowing|NiFiQueueStalled"]
    equal: [cluster, connection_id]
  # 자원 critical 알림이 대응하는 warning 알림을 대신합니다.
  - source_matchers: [alertname="NiFiHeapCritical"]
    target_matchers: [alertname=~"NiFiHeapHigh|NiFiGCTimeHigh"]
    equal: [cluster, node_id]
  - source_matchers: [alertname="NiFiRepositoryDiskCritical"]
    target_matchers: [alertname="NiFiRepositoryDiskHigh"]
    equal: [cluster, node_id, repo, repo_id]
  # collector 실패가 보고된 뒤의 stale 알림은 잡음이므로 억제합니다.
  - source_matchers: [alertname="NiFiCollectorFailing"]
    target_matchers: [alertname="NiFiCollectorStale"]
    equal: [cluster, collector]

receivers:
  - name: ops-slack
    slack_configs:
      - channel: "#nifi-alerts"
        send_resolved: true
        title: '{{ template "nifi.slack.title" . }}'
        text: '{{ template "nifi.slack.text" . }}'

  - name: ops-pager
    # pagerduty_configs / opsgenie_configs / 사내 당직 webhook으로 바꿉니다.
    webhook_configs:
      - url: https://oncall.example.com/webhook/nifi
        send_resolved: true
        max_alerts: 20

  - name: custom-relay
    # nifi-alert-relay가 대상 HTTP API로 다시 보냅니다(exporter/README.md). 대상 하나라도
    # 실패하면 5xx를 돌려주어 Alertmanager가 재시도하고, 이미 성공한 대상은 건너뜁니다.
    webhook_configs:
      - url: http://nifi-alert-relay:9105/alerts
        send_resolved: true
        max_alerts: 0
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /etc/alertmanager/alert_relay_password

  - name: platform-team
    email_configs:
      - to: platform-team@example.com
        send_resolved: true
        headers:
          Subject: '[nifi-exporter] {{ .CommonLabels.alertname }} ({{ .Status }})'
