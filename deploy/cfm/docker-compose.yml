# CFM 클러스터를 모니터링하는 구성입니다: nifi-exporter, Provenance 조회 서비스, Prometheus.
# CFM에는 조회만 합니다. 실제 주소는 .env의 NIFI_BASE_URL에 둡니다(.env.example 참고).
#
#   cp .env.example .env   # NIFI_BASE_URL 편집
#   docker compose up -d
#   python3 ../local/compare.py --nifi "$NIFI_BASE_URL" --prom http://localhost:19091 \
#       --cluster cfm --no-builtin
#
# 이미지 nifi-exporter:local은 deploy/local에서 빌드한 것을 씁니다(없으면 아래 build).
name: nifi-cfm

services:
  nifi-exporter:
    build: ../../exporter
    image: nifi-exporter:local
    env_file: .env
    ports: ["127.0.0.1:19113:9103"]
    volumes:
      - ./nifi-exporter.yaml:/etc/nifi-exporter/config.yaml:ro

  provenance-query:
    image: nifi-exporter:local
    depends_on: [nifi-exporter]
    env_file: .env
    entrypoint: ["nifi-provenance-query"]
    command: ["--config", "/etc/nifi-exporter/config.yaml"]
    ports: ["127.0.0.1:19114:9104"]
    volumes:
      - ./provenance-query.yaml:/etc/nifi-exporter/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.53.4
    depends_on: [nifi-exporter]
    ports: ["127.0.0.1:19091:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
