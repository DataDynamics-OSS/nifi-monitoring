# 화면 캡처 전용 리버스 프록시입니다(compose 프로필 "screenshots"). headless Chromium은
# 클라이언트 인증서를 제시할 수 없으므로 nginx가 관리자 인증서로 대신 제시하고,
# NiFi UI를 localhost:18480에서 평문 HTTP로 제공합니다. 절대 외부에 노출하지 않습니다.
server {
    listen 80;
    location / {
        proxy_pass https://nifi-1:8443;
        proxy_ssl_certificate /certs/admin.pem;
        proxy_ssl_certificate_key /certs/admin.key;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_name nifi-1;
        # NiFi가 Host 헤더를 검증하므로 노드 자신의 주소를 넘깁니다
        proxy_set_header Host nifi-1:8443;
        proxy_redirect https://nifi-1:8443/ /;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
