# rules/nifi-recording.yml의 promtool 단위 테스트입니다.
#   promtool test rules tests/nifi-recording_test.yml   (deploy/prometheus에서 실행합니다)
rule_files:
  - ../rules/nifi-recording.yml

evaluation_interval: 30s

tests:
  # --- 두 Backpressure 비율의 원소별 최댓값 ----------------------------------
  - interval: 30s
    input_series:
      - series: 'nifi_connection_percent_used_count{cluster="c",connection_id="q1",pg_id="pg"}'
        values: "10 10 10"
      - series: 'nifi_connection_percent_used_bytes{cluster="c",connection_id="q1",pg_id="pg"}'
        values: "73 73 73"
      - series: 'nifi_connection_percent_used_count{cluster="c",connection_id="q2",pg_id="pg"}'
        values: "95 95 95"
      - series: 'nifi_connection_percent_used_bytes{cluster="c",connection_id="q2",pg_id="pg"}'
        values: "5 5 5"
      - series: 'nifi_connection_percent_used_count{cluster="c",connection_id="q3",pg_id="pg"}'
        values: "100 100 100"
      - series: 'nifi_connection_percent_used_bytes{cluster="c",connection_id="q3",pg_id="pg"}'
        values: "100 100 100"
    promql_expr_test:
      - expr: nifi:connection_percent_used:max
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:connection_percent_used:max{cluster="c",connection_id="q1",pg_id="pg"}'
            value: 73
          - labels: 'nifi:connection_percent_used:max{cluster="c",connection_id="q2",pg_id="pg"}'
            value: 95
          - labels: 'nifi:connection_percent_used:max{cluster="c",connection_id="q3",pg_id="pg"}'
            value: 100
      - expr: nifi:queues_near_backpressure:count
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:queues_near_backpressure:count{cluster="c"}'
            value: 2
      - expr: nifi:queues_backpressure_engaged:count
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:queues_backpressure_engaged:count{cluster="c"}'
            value: 1

  # --- destination Processor Running 조인 -------------------------------------
  - interval: 30s
    input_series:
      - series: 'nifi_connection_endpoints_info{cluster="c",connection_id="q1",pg_id="pg",source_id="p0",destination_id="p1",source_type="PROCESSOR",source_group_id="pg",destination_type="PROCESSOR",destination_group_id="pg"}'
        values: "1 1 1"
      - series: 'nifi_connection_endpoints_info{cluster="c",connection_id="q2",pg_id="pg",source_id="p0",destination_id="p2",source_type="PROCESSOR",source_group_id="pg",destination_type="PROCESSOR",destination_group_id="pg"}'
        values: "1 1 1"
      - series: 'nifi_connection_endpoints_info{cluster="c",connection_id="q3",pg_id="pg",source_id="p0",destination_id="port-1",source_type="PROCESSOR",source_group_id="pg",destination_type="OUTPUT_PORT",destination_group_id="pg"}'
        values: "1 1 1"
      - series: 'nifi_processor_running{cluster="c",processor_id="p1",pg_id="pg"}'
        values: "1 1 1"
      - series: 'nifi_processor_running{cluster="c",processor_id="p2",pg_id="pg"}'
        values: "0 0 0"
    promql_expr_test:
      - expr: nifi:connection_destination_running
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:connection_destination_running{cluster="c",connection_id="q1",pg_id="pg",source_id="p0",destination_id="p1",source_type="PROCESSOR",source_group_id="pg",destination_type="PROCESSOR",destination_group_id="pg"}'
            value: 1
          - labels: 'nifi:connection_destination_running{cluster="c",connection_id="q2",pg_id="pg",source_id="p0",destination_id="p2",source_type="PROCESSOR",source_group_id="pg",destination_type="PROCESSOR",destination_group_id="pg"}'
            value: 0

  # --- 이름 조인과 큐 증가량 --------------------------------------------------
  - interval: 30s
    input_series:
      - series: 'nifi_connection_queued_flowfiles{cluster="c",connection_id="q1",pg_id="pg"}'
        values: "0+100x20"
      - series: 'nifi_connection_info{cluster="c",connection_id="q1",pg_id="pg",name="success",source_name="Gen",destination_name="Put"}'
        values: "1x20"
    promql_expr_test:
      - expr: nifi:connection_queued_flowfiles:named
        eval_time: 10m
        exp_samples:
          - labels: 'nifi:connection_queued_flowfiles:named{cluster="c",connection_id="q1",pg_id="pg",name="success",source_name="Gen",destination_name="Put"}'
            value: 2000
      - expr: nifi:connection_queued_flowfiles:delta10m
        eval_time: 10m
        exp_samples:
          - labels: 'nifi:connection_queued_flowfiles:delta10m{cluster="c",connection_id="q1",pg_id="pg"}'
            value: 2000

  # --- task를 실행한 Processor만의 평균 task 시간 ------------------------------
  - interval: 30s
    input_series:
      - series: 'nifi_processor_tasks_5m{cluster="c",processor_id="p1",pg_id="pg"}'
        values: "100 100 100"
      - series: 'nifi_processor_tasks_duration_seconds_5m{cluster="c",processor_id="p1",pg_id="pg"}'
        values: "60 60 60"
      - series: 'nifi_processor_tasks_5m{cluster="c",processor_id="p2",pg_id="pg"}'
        values: "0 0 0"
      - series: 'nifi_processor_tasks_duration_seconds_5m{cluster="c",processor_id="p2",pg_id="pg"}'
        values: "0 0 0"
      - series: 'nifi_processor_run_status{cluster="c",processor_id="p1",pg_id="pg",status="Running"}'
        values: "1 1 1"
      - series: 'nifi_processor_run_status{cluster="c",processor_id="p1",pg_id="pg",status="Invalid"}'
        values: "0 0 0"
      - series: 'nifi_processor_run_status{cluster="c",processor_id="p2",pg_id="pg",status="Running"}'
        values: "0 0 0"
      - series: 'nifi_processor_run_status{cluster="c",processor_id="p2",pg_id="pg",status="Invalid"}'
        values: "1 1 1"
    promql_expr_test:
      - expr: nifi:processor_task_duration_avg_seconds_5m
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:processor_task_duration_avg_seconds_5m{cluster="c",processor_id="p1",pg_id="pg"}'
            value: 0.6
      - expr: nifi:processors_invalid:count
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:processors_invalid:count{cluster="c"}'
            value: 1
      - expr: nifi:processors:count_by_status
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:processors:count_by_status{cluster="c",status="Invalid"}'
            value: 1
          - labels: 'nifi:processors:count_by_status{cluster="c",status="Running"}'
            value: 1

  # --- Bulletin 최근 5분 건수와 GC 비율 ---------------------------------------
  - interval: 30s
    input_series:
      - series: 'nifi_bulletins_observed_5m{cluster="c",level="ERROR",pg_id="pg",source_id="p1",source_type="PROCESSOR"}'
        values: "20x20"
      - series: 'nifi_bulletins_observed_5m{cluster="c",level="WARNING",pg_id="pg",source_id="p1",source_type="PROCESSOR"}'
        values: "50x20"
      - series: 'nifi_jvm_gc_seconds_total{cluster="c",node_id="n1",collector="G1 Young Generation"}'
        values: "0+3x20"
      - series: 'nifi_jvm_gc_seconds_total{cluster="c",node_id="n1",collector="G1 Old Generation"}'
        values: "0+3x20"
    promql_expr_test:
      - expr: nifi:bulletins_error:increase5m:sum
        eval_time: 10m
        exp_samples:
          - labels: 'nifi:bulletins_error:increase5m:sum{cluster="c"}'
            value: 20
      - expr: nifi:jvm_gc_time_ratio:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'nifi:jvm_gc_time_ratio:rate5m{cluster="c",node_id="n1"}'
            value: 0.2

  # --- 스레드 풀 사용률: 클러스터(노드별)와 단일 노드 ------------------------------
  - interval: 30s
    input_series:
      - series: 'nifi_node_active_threads{cluster="c",node_id="n1",job="nifi-exporter",instance="x"}'
        values: "9x5"
      - series: 'nifi_node_active_threads{cluster="c",node_id="n2",job="nifi-exporter",instance="x"}'
        values: "2x5"
      - series: 'nifi_controller_max_timer_driven_threads{cluster="c",job="nifi-exporter",instance="x"}'
        values: "10x5"
      - series: 'nifi_cluster_clustered{cluster="c",job="nifi-exporter",instance="x"}'
        values: "1x5"
      - series: 'nifi_controller_active_threads{cluster="c",job="nifi-exporter",instance="x"}'
        values: "11x5"
      - series: 'nifi_controller_max_timer_driven_threads{cluster="s",job="nifi-exporter",instance="y"}'
        values: "10x5"
      - series: 'nifi_cluster_clustered{cluster="s",job="nifi-exporter",instance="y"}'
        values: "0x5"
      - series: 'nifi_controller_active_threads{cluster="s",job="nifi-exporter",instance="y"}'
        values: "4x5"
    promql_expr_test:
      - expr: nifi:thread_pool_utilization
        eval_time: 1m
        exp_samples:
          - labels: 'nifi:thread_pool_utilization{cluster="c",node_id="n1",job="nifi-exporter",instance="x"}'
            value: 0.9
          - labels: 'nifi:thread_pool_utilization{cluster="c",node_id="n2",job="nifi-exporter",instance="x"}'
            value: 0.2
          # 클러스터 c는 노드별 값만 있고 단일 노드용 계산은 나오지 않습니다
          - labels: 'nifi:thread_pool_utilization{cluster="s",node_id="standalone",job="nifi-exporter",instance="y"}'
            value: 0.4

  # 새 source의 첫 수집분은 기준 카운터 없이도 즉시 보입니다.
  - interval: 30s
    input_series:
      - series: 'nifi_bulletins_observed_5m{cluster="c",level="ERROR",pg_id="pg",source_id="new",source_type="PROCESSOR"}'
        values: "_ 15 15 0"
      - series: 'nifi_bulletins_total{cluster="c",level="ERROR",pg_id="pg",source_id="new",source_type="PROCESSOR"}'
        values: "_ 15 15 15"
      - series: 'nifi_bulletins_observed_5m{cluster="c",level="WARNING",pg_id="pg",source_id="new",source_type="PROCESSOR"}'
        values: "_ 99 99 0"
    promql_expr_test:
      - expr: nifi:bulletins_error:increase5m
        eval_time: 30s
        exp_samples:
          - labels: 'nifi:bulletins_error:increase5m{cluster="c",pg_id="pg",source_id="new"}'
            value: 15
      - expr: nifi:bulletins_error:increase5m:sum
        eval_time: 30s
        exp_samples:
          - labels: 'nifi:bulletins_error:increase5m:sum{cluster="c"}'
            value: 15
      - expr: nifi:bulletins_error:increase5m:sum
        eval_time: 90s
        exp_samples:
          - labels: 'nifi:bulletins_error:increase5m:sum{cluster="c"}'
            value: 0
