# NiFi 2.x 모니터링용 Prometheus 설정입니다.
#
# 주 경로 : nifi-exporter(:9103의 /metrics) — 클러스터 집계값입니다.
# 보조 경로: NiFi 내장 /nifi-api/flow/metrics/prometheus를 노드별로 스크레이프합니다.
#            mTLS 또는 인증 없는 HTTP NiFi에서만 쓸 수 있습니다(Prometheus는 NiFi JWT를
#            갱신하지 못합니다).
#            bearer 인증 환경에서는 이 job을 끕니다.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: nifi-monitoring

rule_files:
  - rules/nifi-recording.yml
  - rules/nifi-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # nifi-exporter: exporter 인스턴스마다 대상 하나입니다. `cluster` 레이블은
  # exporter가 직접 붙이므로 여기서 덮어쓰지 않습니다.
  # ---------------------------------------------------------------------------
  - job_name: nifi-exporter
    scrape_interval: 15s
    metrics_path: /metrics
    # 여기의 `cluster`는 exporter의 nifi.cluster_name과 같아야 합니다. 이 값이
    # `up`과 스크레이프 메트릭에 붙어야 exporter가 내려갔을 때 Alertmanager가
    # 클러스터 단위로 억제할 수 있습니다. honor_labels를 켜면 exporter가 노출하는
    # 메트릭에서는 exporter 자신의 `cluster` 레이블이 우선하며, exported_cluster로
    # 이름이 바뀌지 않습니다.
    honor_labels: true
    # exporter의 server.basic_auth와 같아야 합니다(/metrics에 큐·Processor 이름이
    # 노출됩니다). 인증 없이 스크레이프하려면 양쪽 모두에서 제거합니다.
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/nifi-exporter-metrics-password
    static_configs:
      - targets: ["nifi-exporter:9103"]
        labels:
          cluster: prod-nifi
    # 클러스터당 exporter는 정확히 하나입니다. 대상이 둘이면 모든 *_info 시계열이
    # 중복되어 규칙의 group_left 조인이 모두 실패합니다(로컬에서 확인했고,
    # NiFiExporterDuplicate가 발화합니다). 가용성은 재시작하는 실행 환경
    # (systemd/Kubernetes, replicas: 1)과 NiFiExporterDown으로 확보합니다.

  # 사용자 정의 HTTP 수신처 중계(nifi-alert-relay)입니다. NiFiAlertRelayDown·Failing이 씁니다.
  - job_name: nifi-alert-relay
    basic_auth:
      username: alertmanager
      password_file: /etc/prometheus/secrets/alert-relay-password
    static_configs:
      - targets: ["nifi-alert-relay:9105"]

  # ---------------------------------------------------------------------------
  # NiFi 내장 Prometheus 엔드포인트입니다(노드별). HTTPS NiFi에서는 mTLS로만 쓸 수 있습니다.
  # TLS·인증 없는 NiFi(HTTP)라면 scheme을 http로 바꾸고 tls_config를 지운 뒤 대상을
  # "nifi-1.example.com:8080"처럼 HTTP 포트로 적습니다(인증이 없으므로 그대로 읽힙니다).
  # 메트릭 이름은 NiFi의 PrometheusMetricsUtil에서 옵니다(nifi_amount_*, nifi_size_*,
  # nifi_percent_used_*, nifi_jvm_*). 값은 노드별이므로 규칙에서 합산합니다.
  # 엔드포인트 자체의 `instance` 레이블은 `exported_instance`로 보존되어
  # (honor_labels: false) Prometheus 대상 레이블과 충돌하지 않습니다.
  # ---------------------------------------------------------------------------
  - job_name: nifi-builtin
    scrape_interval: 30s
    scrape_timeout: 20s
    scheme: https
    metrics_path: /nifi-api/flow/metrics/prometheus
    params:
      # Bulletin별 시계열은 제외합니다. Bulletin 건수는 nifi-exporter가 셉니다.
      # NiFi 2.6.0에서 동작하며, 모르는 레지스트리 이름을 주면 404를 반환합니다.
      includedRegistries: ["NIFI", "JVM", "CONNECTION"]
    honor_labels: false
    tls_config:
      ca_file: /etc/prometheus/tls/nifi-ca.pem
      cert_file: /etc/prometheus/tls/prometheus-client.pem
      key_file: /etc/prometheus/tls/prometheus-client-key.pem
    static_configs:
      - targets:
          - "nifi-1.example.com:8443"
          - "nifi-2.example.com:8443"
          - "nifi-3.example.com:8443"
        labels:
          cluster: prod-nifi
    relabel_configs:
      # node 레이블은 대상의 호스트 부분이며, nifi_node_info{address}와 조인할 때 씁니다.
      - source_labels: [__address__]
        regex: "([^:]+)(?::\\d+)?"
        target_label: node
        replacement: "$1"
    metric_relabel_configs:
      # 대시보드와 규칙이 쓰는 메트릭만 남기고 나머지는 스크레이프 시점에 버려
      # 시계열 수를 제한합니다.
      - source_labels: [__name__]
        # NiFi 2.6.0 기준 이름입니다.
        regex: "nifi_(amount_(items_(queued|input|output)|bytes_(read|written)|threads_(active|terminated))|size_content_(queued|input|output)_total|percent_used_(count|bytes)|backpressure_(object|bytes)_threshold|backpressure_enabled|jvm_.*|time_to_(bytes|count)_backpressure_prediction)"
        action: keep

  # ---------------------------------------------------------------------------
  # NiFi 호스트의 OS 메트릭입니다(node_exporter, 선택).
  # ---------------------------------------------------------------------------
  - job_name: node
    static_configs:
      - targets:
          - "nifi-1.example.com:9100"
          - "nifi-2.example.com:9100"
          - "nifi-3.example.com:9100"
        labels:
          cluster: prod-nifi
