# NiFi 2.x 모니터링용 알림 규칙입니다.
#
# severity: critical = 즉시 대응, warning = 업무시간 대응입니다.
# component: exporter | cluster | node | jvm | repository | queue | processor | bulletin
#            (Alertmanager 라우팅과 억제에 씁니다).
# 임계치(80%, FlowFile 1,000개, 5분 등)는 초기값이며 운영 데이터 2주 후 조정합니다.
# 큐·Processor 알림에는 *_info 메트릭을 조인한 이름이 붙어 있어 대시보드 없이도
# 통지 내용을 읽을 수 있습니다.

# 모든 NiFi 상태 알림에 keep_firing_for: 5m을 둡니다. exporter나 collector가
# 실패하면 시계열이 즉시 stale이 되어, NiFiExporterDown(for 2m)이나
# NiFiCollectorFailing(for 3m)이 발화해 억제하기 전에 알림이 해소되고 "resolved"가
# 통지됩니다. firing을 유지하면 그대로 억제 상태로 남습니다.
groups:
  # ---------------------------------------------------------------------------
  - name: nifi-collection
    rules:
      - alert: NiFiExporterDown
        expr: up{job="nifi-exporter"} == 0
        for: 2m
        labels: { severity: critical, component: exporter }
        annotations:
          summary: "nifi-exporter 스크레이프 실패 ({{ $labels.instance }})"
          description: "Prometheus가 nifi-exporter에서 2분 이상 메트릭을 받지 못했습니다. 그동안 NiFi 상태 알림은 억제됩니다."

      # 한 클러스터에 exporter가 둘이면 모든 *_info 시계열이 중복되어 `group_left`
      # 조인이 모두 실패하고("duplicate series") 큐·Processor·Bulletin 알림이 조용히
      # 멈춥니다. 클러스터당 exporter는 정확히 하나만 운영합니다.
      - alert: NiFiExporterDuplicate
        expr: count by (cluster) (up{job="nifi-exporter"} == 1) > 1
        for: 2m
        labels: { severity: critical, component: exporter }
        annotations:
          summary: "nifi-exporter 중복 스크레이프 ({{ $labels.cluster }}: {{ $value }}개)"
          description: "한 클러스터에 exporter가 2개 이상 스크레이프되고 있습니다. info 메트릭 조인이 실패해 큐·Processor·Bulletin 알림이 동작하지 않습니다. exporter를 1개만 남기세요."

      - alert: NiFiCollectorFailing
        expr: nifi_exporter_collector_success == 0
        for: 3m
        labels: { severity: critical, component: exporter }
        annotations:
          summary: "nifi-exporter {{ $labels.collector }} 수집 실패"
          description: "Exporter는 살아 있으나 NiFi API 호출이 3분 이상 실패하고 있습니다 (인증 만료, 권한, NiFi 응답 없음). 해당 Collector의 메트릭은 노출되지 않습니다."

      # Stale은 주기의 3배(최소 3분) 동안 성공이 없는 상태입니다. 15~30초 collector는
      # 3분 뒤, 300초 topology collector는 15분 뒤 stale이 됩니다.
      - alert: NiFiCollectorStale
        # nifi:exporter_collector_age_seconds가 아닌 원본 시계열로 계산합니다.
        # 그 규칙은 다른 그룹에 있어 평가 순서가 정해져 있지 않습니다.
        expr: |
          (time() - nifi_exporter_collector_last_success_timestamp_seconds)
          > clamp_min(3 * nifi_exporter_collector_interval_seconds, 180)
        for: 1m
        labels: { severity: warning, component: exporter }
        annotations:
          summary: "nifi-exporter {{ $labels.collector }} 수집 지연 (주기의 3배 경과)"
          description: "마지막 성공 수집으로부터 {{ $value | humanizeDuration }} 지났습니다."

      # flow 응답이 크면 매 flow 주기와 응답하는 NiFi 노드가 느려집니다.
      # flow 주기를 늘리거나 Process Group을 제외합니다.
      - alert: NiFiExporterFlowResponseLarge
        expr: nifi_exporter_api_response_bytes{endpoint="flow_status_recursive"} > 10e6
        for: 30m
        labels: { severity: warning, component: exporter }
        annotations:
          summary: "flow 상태 응답이 10MB 초과 ({{ $labels.cluster }})"
          description: "recursive status 응답 {{ $value | humanize1024 }}B. collectors.flow.interval을 60s로 올리거나 exclude_pg_ids를 검토하세요."

  # ---------------------------------------------------------------------------
  - name: nifi-cluster
    rules:
      - alert: NiFiNodeDisconnected
        expr: nifi_node_connected == 0
        for: 2m
        keep_firing_for: 5m
        labels: { severity: critical, component: node }
        annotations:
          summary: "NiFi 노드 연결 해제: {{ $labels.node_id }}"
          description: "노드가 2분 이상 CONNECTED 상태가 아닙니다. nifi_node_status 로 현재 상태(DISCONNECTED/OFFLOADED 등)를 확인하세요."

      - alert: NiFiNodeHeartbeatStale
        expr: nifi_node_heartbeat_age_seconds > 60
        for: 2m
        keep_firing_for: 5m
        labels: { severity: warning, component: node }
        annotations:
          summary: "NiFi 노드 heartbeat 지연: {{ $labels.node_id }}"
          description: "마지막 heartbeat 이후 {{ $value | humanizeDuration }} 경과. 노드 과부하 또는 네트워크 문제 가능성."

      - alert: NiFiClusterQuorumLost
        expr: nifi_cluster_nodes_connected <= (nifi_cluster_nodes_total / 2)
        for: 1m
        keep_firing_for: 5m
        labels: { severity: critical, component: cluster }
        annotations:
          summary: "NiFi 연결 노드 수가 과반 미만 ({{ $labels.cluster }})"
          description: "연결 노드 {{ $value }}개. 클러스터 전체 처리 중단 위험."

  # ---------------------------------------------------------------------------
  - name: nifi-resources
    rules:
      - alert: NiFiHeapHigh
        expr: nifi_jvm_heap_utilization > 0.85
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, component: jvm }
        annotations:
          summary: "NiFi heap 85% 초과: {{ $labels.node_id }}"
          description: "heap 사용률 {{ $value | humanizePercentage }}."

      - alert: NiFiHeapCritical
        expr: nifi_jvm_heap_utilization > 0.95
        for: 3m
        keep_firing_for: 5m
        labels: { severity: critical, component: jvm }
        annotations:
          summary: "NiFi heap 95% 초과: {{ $labels.node_id }}"
          description: "heap 사용률 {{ $value | humanizePercentage }}. OOM 임박."

      - alert: NiFiGCTimeHigh
        expr: nifi:jvm_gc_time_ratio:rate5m > 0.2
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, component: jvm }
        annotations:
          summary: "NiFi GC 시간 비율 20% 초과: {{ $labels.node_id }}"
          description: "최근 5분 GC 시간 비율 {{ $value | humanizePercentage }}."

      # timer-driven 스레드 풀이 거의 다 찼습니다. Processor가 실행할 스레드를 기다리느라
      # 처리 전체가 밀립니다(특정 큐가 아니라 여러 큐가 함께 쌓이는 원인이 됩니다).
      - alert: NiFiThreadPoolSaturated
        expr: nifi:thread_pool_utilization >= 0.9
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, component: jvm }
        annotations:
          summary: "NiFi 스레드 풀 포화: {{ $labels.node_id }}"
          description: "timer-driven 스레드 풀 사용률 {{ $value | humanizePercentage }} (10분 이상). Processor가 스레드를 기다리느라 처리가 밀립니다. 오래 걸리는 Task와 maxTimerDrivenThreadCount를 확인하세요."

      - alert: NiFiRepositoryDiskHigh
        expr: nifi_repo_utilization > 0.80
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, component: repository }
        annotations:
          summary: "NiFi {{ $labels.repo }} 리포지토리 디스크 80% 초과: {{ $labels.node_id }}"
          description: "{{ $labels.repo }}/{{ $labels.repo_id }} 사용률 {{ $value | humanizePercentage }}."

      - alert: NiFiRepositoryDiskCritical
        expr: nifi_repo_utilization > 0.92
        for: 2m
        keep_firing_for: 5m
        labels: { severity: critical, component: repository }
        annotations:
          summary: "NiFi {{ $labels.repo }} 리포지토리 디스크 92% 초과: {{ $labels.node_id }}"
          description: "{{ $labels.repo }}/{{ $labels.repo_id }} 사용률 {{ $value | humanizePercentage }}. 디스크 고갈 시 NiFi 처리가 멈춥니다."

  # ---------------------------------------------------------------------------
  - name: nifi-queues
    rules:
      - alert: NiFiQueueNearBackpressure
        expr: nifi:connection_percent_used:named > 80
        for: 5m
        keep_firing_for: 5m
        labels: { severity: warning, component: queue }
        annotations:
          summary: "큐 Backpressure 한도 80% 초과: {{ $labels.source_name }} → {{ $labels.destination_name }} ({{ $labels.name }})"
          description: "connection {{ $labels.connection_id }} 사용률 {{ $value }}%. destination 처리량·스레드·Bulletin을 확인하세요."

      - alert: NiFiQueueBackpressureEngaged
        expr: nifi:connection_percent_used:named >= 100
        for: 5m
        keep_firing_for: 5m
        labels: { severity: critical, component: queue }
        annotations:
          summary: "큐 Backpressure 발동: {{ $labels.source_name }} → {{ $labels.destination_name }} ({{ $labels.name }})"
          description: "connection {{ $labels.connection_id }} 가 한도에 도달해 상류 Processor가 정지됩니다."

      - alert: NiFiQueueGrowing
        expr: |
          (
            nifi:connection_queued_flowfiles:delta10m > 1000
            and nifi_connection_queued_flowfiles > 1000
          )
          * on (cluster, connection_id) group_left (name, source_name, destination_name)
          nifi_connection_info
        for: 5m
        keep_firing_for: 5m
        labels: { severity: warning, component: queue }
        annotations:
          summary: "큐 10분간 1,000개 이상 증가: {{ $labels.source_name }} → {{ $labels.destination_name }} ({{ $labels.name }})"
          description: "connection {{ $labels.connection_id }} 10분 증가량 {{ $value | humanize }}개."

      - alert: NiFiQueueStalled
        expr: |
          (
            nifi_connection_queued_flowfiles > 0
            and nifi_connection_flowfiles_out_5m == 0
            and on (cluster, connection_id) nifi:connection_destination_running == 1
          )
          * on (cluster, connection_id) group_left (name, source_name, destination_name)
          nifi_connection_info
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, component: queue }
        annotations:
          summary: "큐 정체(소비 0): {{ $labels.source_name }} → {{ $labels.destination_name }} ({{ $labels.name }})"
          description: "destination 이 Running 인데 10분간 FlowFile 소비가 없습니다. 적체 {{ $value | humanize }}개. destination 의 Bulletin/스레드를 확인하세요."

  # ---------------------------------------------------------------------------
  - name: nifi-processors
    rules:
      - alert: NiFiProcessorInvalid
        expr: |
          (nifi_processor_run_status{status="Invalid"} == 1)
          * on (cluster, processor_id) group_left (name, type)
          nifi_processor_info
        for: 5m
        keep_firing_for: 5m
        labels: { severity: warning, component: processor }
        annotations:
          summary: "Processor Invalid: {{ $labels.name }} ({{ $labels.type }})"
          description: "processor {{ $labels.processor_id }} (PG {{ $labels.pg_id }}) 가 5분 이상 Invalid 상태입니다. 속성/컨트롤러 서비스 설정을 확인하세요."

      - alert: NiFiProcessorTerminatedThreads
        expr: |
          (nifi_processor_terminated_threads > 0)
          * on (cluster, processor_id) group_left (name, type)
          nifi_processor_info
        for: 5m
        keep_firing_for: 5m
        labels: { severity: warning, component: processor }
        annotations:
          summary: "Processor 강제 종료 스레드 존재: {{ $labels.name }} ({{ $labels.type }})"
          description: "processor {{ $labels.processor_id }} 에 terminated 스레드 {{ $value }}개. 재시작 또는 노드 재기동이 필요할 수 있습니다."

      - alert: NiFiProcessorSlowTasks
        expr: |
          (nifi:processor_task_duration_avg_seconds_5m > 30)
          * on (cluster, processor_id) group_left (name, type)
          nifi_processor_info
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, component: processor }
        annotations:
          summary: "Processor 평균 task 30초 초과: {{ $labels.name }} ({{ $labels.type }})"
          description: "processor {{ $labels.processor_id }} 평균 task 시간 {{ $value | humanizeDuration }} (최근 5분)."

  # ---------------------------------------------------------------------------
  - name: nifi-bulletins
    rules:
      # Processor source는 nifi_processor_info에서 이름·타입을 가져옵니다. 그 밖의
      # source(컨트롤러 서비스, Reporting Task, source_id가 빈 컨트롤러 자체)도
      # 이름 없이 발화합니다.
      - alert: NiFiBulletinErrors
        expr: |
          (
            (nifi:bulletins_error:increase5m > 10)
            * on (cluster, source_id) group_left (name, type)
            label_replace(nifi_processor_info, "source_id", "$1", "processor_id", "(.*)")
          )
          or on (cluster, pg_id, source_id)
          (nifi:bulletins_error:increase5m > 10)
        for: 5m
        keep_firing_for: 5m
        labels: { severity: warning, component: bulletin }
        annotations:
          summary: "ERROR Bulletin 5분간 10건 초과: {{ if $labels.name }}{{ $labels.name }} ({{ $labels.type }}){{ else }}source {{ or $labels.source_id \"controller\" }}{{ end }}"
          description: "source {{ or $labels.source_id \"controller\" }}{{ if $labels.pg_id }} (PG {{ $labels.pg_id }}){{ end }} 에서 5분간 ERROR {{ $value | humanize }}건."

  # ---------------------------------------------------------------------------
  # nifi-alert-relay(사용자 정의 HTTP 수신처 중계)의 상태입니다. 이 알림은 Slack으로도
  # 가므로 중계가 멈춰도 알 수 있습니다. component=relay라서 NiFi 알림 억제와 무관합니다.
  - name: nifi-alert-relay
    rules:
      - alert: NiFiAlertRelayDown
        expr: up{job="nifi-alert-relay"} == 0
        for: 5m
        labels: { severity: warning, component: relay }
        annotations:
          summary: "nifi-alert-relay 스크레이프 실패 ({{ $labels.instance }})"
          description: "사용자 정의 HTTP 수신처로 알림이 전달되지 않습니다. Slack 등 다른 수신처는 영향이 없습니다."

      # 재시도까지 실패한 전송입니다. Alertmanager가 통지를 다시 보내므로 일시적 실패는
      # 곧 해소되지만, 대상 API가 계속 거부하면 이 알림이 이어집니다.
      - alert: NiFiAlertRelayFailing
        expr: increase(nifi_alert_relay_deliveries_total{result="failed"}[15m]) > 0
        labels: { severity: warning, component: relay }
        annotations:
          summary: "알림 중계 실패: 대상 {{ $labels.target }}"
          description: "최근 15분 동안 {{ $labels.target }} 대상으로 {{ $value | humanize }}건 전송에 실패했습니다. nifi-alert-relay 로그의 HTTP 응답을 확인하세요."
