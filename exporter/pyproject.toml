[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifi-exporter"
version = "0.1.0"
description = "Prometheus exporter for Apache NiFi 2.x (cluster, flow status, system diagnostics, bulletins)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "prometheus-client>=0.21,<1",
    "httpx>=0.28,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpserver>=1.1",
    "ruff>=0.8",
]

[project.scripts]
nifi-exporter = "nifi_exporter.__main__:main"
nifi-provenance-query = "nifi_exporter.provenance:main"
nifi-alert-relay = "nifi_exporter.alert_relay:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nifi_exporter*"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
